<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أساس التصميم — ريف القصيم</title>
  <meta name="description" content="مرجع نظام التصميم والمكونات لنموذج ريف القصيم.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF7F1">
  <script>
    /* Apply the saved language before first paint (avoids an RTL→LTR flash) */
    try {
      if (JSON.parse(localStorage.getItem("rif:v1:lang")) === "en") {
        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <!-- Web fonts load without blocking the page; system fonts are the fallback -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/styleguide.css">
  <script type="module" src="../js/pages/styleguide.js"></script>
</head>
<body>
  <main id="main">
    <div class="container" data-styleguide>
      <!-- Rendered by js/pages/styleguide.js -->
      <noscript><p style="padding:6rem 0">يحتاج هذا النموذج إلى تفعيل JavaScript.</p></noscript>
    </div>
  </main>
</body>
</html>
